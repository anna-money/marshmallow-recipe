name: CI
on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]
env:
  RUSTUP_INIT: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --component clippy --component rustfmt
jobs:
  test:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
        combo:
          - {marshmallow: "marshmallow==2.20.5", webargs: "webargs>=6,<7"}
          - {marshmallow: "marshmallow[reco]==2.20.5", webargs: "webargs>=6,<7"}
          - {marshmallow: "marshmallow>=2,<3", webargs: "webargs>=6,<7"}
          - {marshmallow: "marshmallow[reco]>=2,<3", webargs: "webargs>=6,<7"}
          - {marshmallow: "marshmallow>=3,<4", webargs: "webargs>=7,<8"}
          - {marshmallow: "marshmallow>=3,<4", webargs: "webargs>=8"}
    env:
      UV_EXTRA_ARGS: --with "${{ matrix.combo.marshmallow }}" --with "${{ matrix.combo.webargs }}"
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: ${{ env.RUSTUP_INIT }} && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - run: echo ${{ matrix.python-version }} > .python-version
      - run: make deps
      - run: make lint MODE=ci
      - run: make test
  build:
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: ubuntu-26.04
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
          - os: macos-26
            target: aarch64-apple-darwin
            manylinux: "auto"
            macosx-deployment-target: "11.0"
          - os: macos-26-intel
            target: x86_64-apple-darwin
            manylinux: "auto"
            macosx-deployment-target: "10.12"
    steps:
      - uses: actions/checkout@v6
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i.bak "s/^version = .*/version = \"$VERSION\"/" Cargo.toml && rm Cargo.toml.bak
      - uses: actions/setup-python@v6
        if: runner.os == 'macOS'
        with:
          python-version: "3.15"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macosx-deployment-target }}
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.12 -i python3.13 -i python3.14 -i python3.15
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl
  test-wheel:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-26, macos-26-intel]
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: echo ${{ matrix.python-version }} > .python-version
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist
      - run: uv sync --no-install-project
      - run: uv pip install marshmallow-recipe --find-links dist --no-index --no-deps
      - run: uv run --no-sync python -c "import marshmallow_recipe"
  sdist:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - run: ${{ env.RUSTUP_INIT }} && echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml
      - run: make build-sdist
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: sdist
          path: dist/*.tar.gz
  publish:
    needs: [test, build, sdist, test-wheel]
    runs-on: ubuntu-26.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
      - run: uv publish dist/*
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
